    <div class="page-hero"><div class="wrap page-hero-inner"><div><p class="kicker"><span></span>清水在地農產</p><h1>清水紅土的<br>季節風味。</h1><p class="intro">清水的紅土除了長蘿蔔，也長花生、芝麻和各時節的蔬果。一年到頭，田裡和餐桌都會換一點味道。</p></div><img src="assets/field.webp" alt="清水在地農人的田間耕作" fetchpriority="high"></div></div><section class="section products"><div class="wrap"><h2>我們種的農產</h2><div class="cards"><article><a href="pd-2.html"><img src="assets/peanuts.webp" alt="紅土九號花生" loading="lazy"><h3>紅土九號花生 <span aria-hidden="true">↗</span></h3></a><p>殼薄、仁飽滿，適合鹽炒、做花生糖，也可以榨油。</p></article><article><a href="pd-1.html"><img src="assets/sesame.webp" alt="紅土黑芝麻" loading="lazy"><h3>紅土黑芝麻 <span aria-hidden="true">↗</span></h3></a><p>從採收、翻曬到過篩，留下清水紅土黑芝麻的堅果香。</p></article><article><a href="vegetables.html"><img src="assets/vegetables.webp" alt="當季蔬果" loading="lazy"><h3>當季蔬果 <span aria-hidden="true">↗</span></h3></a><p>跟著節氣種植與採收，供應隨季節變化。</p></article><article><a href="oils.html"><img src="assets/oils.webp" alt="自產食用油" loading="lazy"><h3>自產食用油 <span aria-hidden="true">↗</span></h3></a><p>以自家的九號花生和黑芝麻榨油，依收成供應。</p></article></div></div></section>
